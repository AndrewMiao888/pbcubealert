
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PB Cube Stock Monitor</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0d10;
        color: white;
        font-family: Arial, sans-serif;
    }

    .box {
        width: min(600px, 90%);
        padding: 30px;
        border-radius: 20px;
        background: #171a20;
        text-align: center;
        box-shadow: 0 20px 60px #0008;
    }

    h1 {
        margin-top: 0;
    }

    #stock {
        font-size: 42px;
        font-weight: bold;
        margin: 25px 0 10px;
    }

    #status {
        color: #aab1bd;
        min-height: 24px;
    }

    button {
        margin-top: 25px;
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
    }

    .one {
        color: #ff4757;
        animation: pulse 0.7s infinite alternate;
    }

    .ok {
        color: #4cd97b;
    }

    .unknown {
        color: #f5c542;
    }

    @keyframes pulse {
        from { transform: scale(1); }
        to   { transform: scale(1.08); }
    }
</style>
</head>

<body>

<div class="box">
    <h1>MoYu PB WR 3×3</h1>

    <div id="stock" class="unknown">CHECKING...</div>

    <div id="status">
        Starting monitor...
    </div>

    <button onclick="checkStock()">CHECK NOW</button>
</div>

<script>
const PRODUCT =
    "https://speedcubeshop.com/products/pb-wr-3x3-magnetic-maglev-20-magnet-ball-core-uv-coated";

const PRODUCT_JSON =
    PRODUCT + ".js";

const CHECK_EVERY =
    10000; // 10 seconds

let previousStock = null;
let alerted = false;


/* -----------------------------------------
   Browser notification permission
----------------------------------------- */

async function enableNotifications() {
    if ("Notification" in window) {
        if (Notification.permission === "default") {
            await Notification.requestPermission();
        }
    }
}


/* -----------------------------------------
   Notify
----------------------------------------- */

function notify(stock) {

    if (alerted) return;

    alerted = true;

    const message =
        "The MoYu PB WR 3×3 has only 1 unit left!";

    // Browser notification
    if (
        "Notification" in window &&
        Notification.permission === "granted"
    ) {
        new Notification("🚨 PB CUBE — 1 LEFT!", {
            body: message,
            requireInteraction: true
        });
    }

    // Also change the page
    document.title = "🚨 PB CUBE — 1 LEFT!";

    document.getElementById("stock").textContent =
        "🚨 1 LEFT";

    document.getElementById("stock").className =
        "one";

    document.getElementById("status").textContent =
        "ONLY ONE UNIT REMAINING — BUY NOW!";

    // Repeated sound
    beep();
}


/* -----------------------------------------
   Sound
----------------------------------------- */

function beep() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.frequency.value = 1000;

        oscillator.connect(gain);
        gain.connect(audio.destination);

        gain.gain.value = 0.25;

        oscillator.start();

        setTimeout(() => {
            oscillator.stop();
            audio.close();
        }, 1000);

    } catch (e) {
        console.log("Sound unavailable.");
    }
}


/* -----------------------------------------
   Get stock
----------------------------------------- */

async function getStock() {

    const response =
        await fetch(PRODUCT_JSON, {
            cache: "no-store"
        });

    if (!response.ok) {
        throw new Error(
            "Could not access SpeedCubeShop product data."
        );
    }

    const product =
        await response.json();

    /*
       Look through all variants.

       Shopify product JSON may expose
       inventory_quantity on variants.
    */

    let quantities = [];

    for (const variant of product.variants || []) {

        if (
            typeof variant.inventory_quantity ===
            "number"
        ) {
            quantities.push(
                variant.inventory_quantity
            );
        }
    }

    if (!quantities.length) {
        throw new Error(
            "Inventory quantity is not exposed."
        );
    }

    /*
       If the product has multiple variants,
       use the total available quantity.
    */

    return quantities.reduce(
        (total, quantity) =>
            total + Math.max(0, quantity),
        0
    );
}


/* -----------------------------------------
   Check
----------------------------------------- */

async function checkStock() {

    const stockElement =
        document.getElementById("stock");

    const statusElement =
        document.getElementById("status");

    try {

        statusElement.textContent =
            "Checking SpeedCubeShop...";

        const stock =
            await getStock();

        previousStock = stock;

        if (stock === 1) {

            notify(stock);

            return;
        }

        alerted = false;

        stockElement.textContent =
            stock + " LEFT";

        stockElement.className =
            stock > 1 ? "ok" : "unknown";

        statusElement.textContent =
            "Monitoring every 10 seconds.";

    } catch (error) {

        console.error(error);

        stockElement.textContent =
            "UNKNOWN";

        stockElement.className =
            "unknown";

        statusElement.textContent =
            "Stock quantity couldn't be read. " +
            error.message;
    }
}


/* -----------------------------------------
   Start
----------------------------------------- */

async function start() {

    await enableNotifications();

    await checkStock();

    setInterval(
        checkStock,
        CHECK_EVERY
    );
}

start();

</script>

</body>
</html>
